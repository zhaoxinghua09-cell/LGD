# S5.1 外人角度实测 · GitHub Actions 匿名 runner（v2）
#
# 为什么放在 GitHub Actions 而不是本机：
#   1. runner 是干净容器，没有本机的凭据、缓存、环境变量 —— 天然就是「陌生人环境」；
#   2. 本机无 git/gh，代理对 codeload 不稳定，clone 类测试根本跑不起来；
#   3. 每次运行留下公开可查的 run log 与 step summary，谁都能复核，不必信口头结论。
#
# 纪律（与《发布前审查》一致，也与本仓 CI「零外部 action 依赖」一致）：
#   - 全程 persist-credentials: false + 不引用任何 secrets，模拟无凭据访问；
#   - 不使用任何第三方/官方 action（无 setup-python / upload-artifact），
#     证据写进 $GITHUB_STEP_SUMMARY 与 run log，公开可查；
#   - 任何一步失败即 job 失败，不写 continue-on-error，不把「没跑成」记成「通过」；
#   - quickstart 只收录有 README 原命令的仓；新增仓先填命令再进矩阵。

name: outsider-check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"   # 每周一 02:00 UTC，防引用腐烂（SF-015）

permissions:
  contents: read

jobs:
  # ---------- 一、可读性：匿名能不能拿到、拿到的是什么 ----------
  readable:
    name: readable / ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - zhaoxinghua09-cell/LGD
          - zhaoxinghua09-cell/lgd-theory
          - zhaoxinghua09-cell/lgd-glossary
          - zhaoxinghua09-cell/uibc-core
          - LGD-Eval/skill-audit
    steps:
      - name: 匿名 clone（不带任何凭据）
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/${{ matrix.repo }}.git" src
          echo "cloned_ok=1" >> "$GITHUB_ENV"

      - name: 首屏与可发现性检查
        run: |
          set -euo pipefail
          cd src
          fail=0
          {
            echo "### readable / ${{ matrix.repo }}"
            echo '```'
            ls -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f README.md ] || { echo "::error::${{ matrix.repo }} 缺 README.md（陌生人第一眼看到空仓）"; fail=1; }
          if [ -f LICENSE ] || [ -f LICENSE.md ] || [ -f COPYING ]; then
            echo "license_file=yes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::${{ matrix.repo }} 无 LICENSE 文件（若为自定义许可，README 必须自解释）"
            echo "license_file=no" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f llms.txt ]; then echo "llms_txt=yes" >> "$GITHUB_STEP_SUMMARY"; else echo "llms_txt=no" >> "$GITHUB_STEP_SUMMARY"; fi
          # README 首屏不得为空
          head -c 400 README.md 2>/dev/null | grep -q '[^[:space:]]' \
            || { echo "::error::${{ matrix.repo }} README 首 400 字节为空"; fail=1; }
          exit $fail

  # ---------- 二、可执行性：quickstart 原命令到底能不能跑起来 ----------
  quickstart:
    name: quickstart / uibc-core
    runs-on: ubuntu-latest
    needs: readable
    steps:
      - name: 匿名 clone
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/zhaoxinghua09-cell/uibc-core.git" src

      # ubuntu-latest 自带 python3，不引 setup-python（零外部 action 依赖）
      - name: 一致性自检（README「Run it in 3 minutes」原命令）
        working-directory: src
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -m unittest discover tests

      - name: 独立校验器（原命令）
        working-directory: src
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 independent_verifier/cross_check.py

      - name: 记录 quickstart 证据
        if: always()
        run: |
          echo "### quickstart / zhaoxinghua09-cell/uibc-core" >> "$GITHUB_STEP_SUMMARY"
          echo "result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "cmd: python3 -m unittest discover tests && python3 independent_verifier/cross_check.py" >> "$GITHUB_STEP_SUMMARY"

  # ---------- 三、汇总为 S5.1 证据 ----------
  report:
    name: S5.1 evidence
    runs-on: ubuntu-latest
    needs: [readable, quickstart]
    if: always()
    steps:
      - name: 写出证据摘要
        run: |
          {
            echo "## S5.1 outsider-check evidence"
            echo '```json'
            printf '{\n'
            printf '  "generated": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "runner": "github-actions/ubuntu-latest (anonymous, no secrets, no external actions)",\n'
            printf '  "readable": "%s",\n' "${{ needs.readable.result }}"
            printf '  "quickstart": "%s"\n' "${{ needs.quickstart.result }}"
            printf '}\n'
            echo '```'
            echo "> readable=failure 或 quickstart=failure 时，S5.1 判 BLOCK，不得记通过。"
          } >> "$GITHUB_STEP_SUMMARY"
